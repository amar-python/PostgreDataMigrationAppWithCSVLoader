# Local checks before each commit (#324), the same ones CI runs after a push. Set up once per clone:
#
#   pip install -r requirements-dev.txt     (includes pre-commit and mypy)
#   pre-commit install                      (Windows PowerShell too: pre-commit runs these hooks itself)
#   pre-commit run --all-files              (optional: check the whole tree now)
#
#   flake8     the lint options in .flake8, which match scripts/lint.sh (the CI lint)
#   bandit     as scripts/lint.sh runs it: medium severity and up, not over test code (tests/, e2e/)
#   gitleaks   the secret scan, with the repository's .gitleaks.toml, over the staged changes (#326)
#   mypy       the type check configured in pyproject.toml (#323)
#   gap-registers  tests/unit/test_gap_registers_agree.py, when a gap register or the VCRM changes
#
# No formatter yet: adopting one means reformatting the codebase, which #324 wants as a separate one-off commit.
# Versions: flake8 and bandit are the minimums requirements-dev.txt asks for; gitleaks is the one security-scan.yml runs.
repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "-q"]
        exclude: ^(tests|e2e)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (pyproject.toml)
        # The project's own environment, so mypy sees the installed packages (FastAPI, Streamlit, ...).
        language: system
        entry: python -m mypy
        types: [python]
        pass_filenames: false

      - id: gap-registers
        name: gap registers agree
        language: system
        entry: python -m pytest tests/unit/test_gap_registers_agree.py -q -p no:cacheprovider
        files: ^(docs/|tests/unit/test_gap_registers_agree\.py$)
        pass_filenames: false
