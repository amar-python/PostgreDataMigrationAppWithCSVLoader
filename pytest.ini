[pytest]
markers =
    unit: no external dependencies; always safe to run
    integration: requires a running PostgreSQL instance
    e2e: full end-to-end pipeline; requires PostgreSQL
    regression: pinned tests for previously found bug classes
    security: static security and credential pattern scans
    snapshot: golden-file output comparison tests
    parity: cross-environment row-count consistency tests
    system: whole-system behaviour through the public API; requires PostgreSQL
    sit: system integration — contracts between API, database, frontend and scripts
    performance: throughput, latency and resource-bound tests (PERF_BUDGET_SCALE scales budgets)
    accessibility: WCAG 2.1 AA checks on the frontend with Playwright + axe-core
    uat: user acceptance tests written as Given/When/Then user stories

addopts = -ra -q
testpaths = tests
