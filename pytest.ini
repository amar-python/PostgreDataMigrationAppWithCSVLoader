[pytest]
markers =
    unit: no external dependencies; always safe to run
    integration: requires a running PostgreSQL instance
    e2e: full end-to-end pipeline; requires PostgreSQL
    regression: pinned tests for previously found bug classes
    security: static security and credential pattern scans
    snapshot: golden-file output comparison tests
    parity: cross-environment row-count consistency tests
    system: whole-component behaviour through its public surface (tests/system/)
    sit: system integration — several components plus PostgreSQL (tests/system_integration/)
    performance: timing and throughput budgets (tests/performance/)
    accessibility: WCAG scans; needs Playwright browsers and a running frontend
    id(name): stable test-case ID for docs/TEST_CASES.md; optional (#169)
    uat: user-acceptance scenarios traced to an issue or user story (tests/uat/)

addopts = -ra -q
testpaths = tests
