[pytest]
markers =
    unit: no external dependencies; always safe to run
    integration: requires a running PostgreSQL instance
    e2e: full end-to-end pipeline; requires PostgreSQL
    regression: pinned tests for previously found bug classes
    security: static security and credential pattern scans
    snapshot: golden-file output comparison tests
    parity: cross-environment row-count consistency tests
    tooling: runs the repo's real shell scripts and needs bash; Linux jobs and local runs, not the Windows job
    system: the API against a live PostgreSQL (tests/system/); added automatically by folder
    sit: system integration, whole-pipeline and cross-environment tests (tests/system_integration/); added automatically by folder
    performance: load and timing tests (tests/performance/); added automatically by folder
    accessibility: WCAG scans in a real browser (tests/accessibility/); added automatically by folder, runs only in its own CI job
    uat: user-acceptance scenarios (tests/uat/); added automatically by folder

addopts = -ra -q
testpaths = tests
