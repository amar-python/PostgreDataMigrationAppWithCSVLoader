# Alembic configuration for the API's uploads schema (#84).
# The database URL and target schema come from api/config.py (libpq env vars),
# so there is no sqlalchemy.url here. Run from the repo root:
#   alembic upgrade head
# api/db.py bootstrap() runs the same upgrade on every API start.

[alembic]
script_location = %(here)s/alembic
path_separator = os
