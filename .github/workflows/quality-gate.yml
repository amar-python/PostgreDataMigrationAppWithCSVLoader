name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:

# A newer push to a pull request makes the older run pointless: cancel it (it was minutes of runner time and, for the
# database jobs, tens of minutes). Pushes to main are never cancelled: every merge keeps its own full run.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #325: the token can read the repository and nothing else. No job here writes to it (artifacts need no scope); a job
# that ever needs more raises it for itself, not for the whole workflow.
permissions:
  contents: read

jobs:
  # Does this change need the slow database jobs? Only documentation that nothing reads can skip them (scripts/ci_changes.py
  # says why, and runs everything when in doubt). Decided in a job, not by a workflow-level `paths-ignore`, because that
  # would leave the required check pending forever on a documentation-only pull request.
  changes:
    name: changes (does this need the database jobs?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the diff against the base needs its history

      - name: Decide
        id: decide
        run: |
          python3 scripts/ci_changes.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  # Fast, deterministic checks — no database, no network beyond pip.
  free-tier:
    name: free-tier (unit, lint, health, evals-p)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies
        # #327: one hashed lock (scripts/lock_requirements.sh): requirements-dev.txt plus api/requirements.txt, which
        # is needed too because tests/test_api.py imports FastAPI at module level.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Unit / regression / security / snapshot tests — final result
        run: |
          python3 scripts/test_report.py \
            --markers "unit or regression or security or snapshot" --strict

      - name: Lint (flake8 + bandit)
        run: make lint

      # #323: mypy over api/ and streamlit_app/, configured in pyproject.toml. A new type error fails the job.
      - name: Type check (mypy)
        run: make typecheck

      - name: Component health check
        run: make health

      # #169: the test catalogue is generated here, not committed. This step fails
      # the build if the generator itself breaks; the file is attached below.
      - name: Generate test catalogue
        run: python3 scripts/test_catalogue.py

      # Tier X (cross-engine) is deliberately absent: multi-engine support is
      # deferred by ADR-0001 (PostgreSQL first), so this pipeline is PostgreSQL
      # only. The scenario still exists and passes — run it with `make
      # evals-engines`. Re-add `,x` here when multi-engine work resumes.
      - name: Evals — Tier P (offline validator scenarios)
        run: python3 evals/runner.py --tiers p --verbose

      # Reports (incl. the VCRM gap report) are written to evals/reports/ and
      # would otherwise vanish with the runner — keep them for auditability.
      - name: Upload test catalogue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-catalogue
          path: docs/TEST_CASES.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports-free-tier
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 30

  # The whole suite, split by test file (scripts/ci_shards.py) into parallel jobs, each with its own PostgreSQL: the
  # system tests share databases and assume a fresh one, so they cannot share a server. Each shard prints the same final
  # block as before (PASSED / FAILED / ERROR / SKIPPED with reasons / NOT RUN) and --strict fails it on any skip.
  # Full integration surface: Tier I deploys env_dev.sql twice (idempotency), Tier S runs the 159-assertion SQL suite,
  # then the PG-gated pytest tiers run. Every shard repeats that cheap setup (a few seconds): the cross-environment
  # parity tests rely on it.
  integration-shards:
    name: integration shard ${{ matrix.shard }} (postgres service)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false   # one red shard must not hide what the others found
      matrix:
        shard: [1, 2, 3]   # keep in step with SHARDS in scripts/ci_shards.py (a test checks it)
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies
        # #327: one hashed lock (scripts/lock_requirements.sh): requirements-dev.txt plus api/requirements.txt, which
        # is needed too because tests/test_api.py imports FastAPI at module level.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Write CI database config
        run: |
          cat > build/config.local.env <<'EOF'
          DB_ENGINE="postgresql"
          PG_HOST="localhost"
          PG_PORT="5432"
          PG_SUPERUSER="postgres"
          PG_SUPERUSER_PASSWORD="postgres"
          PG_DB_DEV="te_mgmt_dev"
          PG_SCHEMA_DEV="te_dev"
          PG_DB_TEST="te_mgmt_test"
          PG_SCHEMA_TEST="te_test"
          PG_DB_STAGING="te_mgmt_staging"
          PG_SCHEMA_STAGING="te_staging"
          PG_DB_PROD="te_mgmt_prod"
          PG_SCHEMA_PROD="te_prod"
          EOF

      # env_*.sql scripts do not create their databases — deploy_all.sh does that
      # before invoking them (see build/te_core_schema.sql:41). Mirror it here.
      # Only *.example.sql are committed (concrete env_<env>.sql are gitignored),
      # so materialise them before anything that deploys an environment.
      - name: Materialise environment launchers from templates
        run: |
          for env in dev test staging prod; do
            cp "build/environments/env_${env}.example.sql" \
               "build/environments/env_${env}.sql"
          done
          ls -1 build/environments/

      - name: Create environment databases
        run: |
          for db in te_mgmt_dev te_mgmt_test te_mgmt_staging te_mgmt_prod; do
            if [ -z "$(psql -d postgres -tA -c "SELECT 1 FROM pg_database WHERE datname = '$db'")" ]; then
              psql -v ON_ERROR_STOP=1 -d postgres -c \
                "CREATE DATABASE \"$db\" WITH OWNER = postgres ENCODING = 'UTF8' TEMPLATE = template0 CONNECTION LIMIT = -1"
            fi
          done

      # Tier E deploys all four environments and compares their schemas, so it
      # runs here where the postgres service exists. Order matters: E deploys
      # every environment, which the cross-env parity pytest markers then rely on.
      # Tier X is excluded per ADR-0001 — see the free-tier job's note.
      - name: Evals — Tiers P, I, S, E
        run: python3 evals/runner.py --tiers p,i,s,e --verbose

      - name: Deploy all environments (for cross-env parity)
        run: |
          for env in dev test staging prod; do
            bash build/deploy_all.sh "$env"
          done

      # The API reads PGDATABASE (api/config.py). The schema lives in te_mgmt_dev, not the job-level default
      # "postgres" (issue #45). Accessibility scans need a browser and the frontend, not this database; they run in the
      # `accessibility` job (#168) and are reported here as NOT RUN, not as skipped.
      # Coverage is measured here, as the shard runs, instead of in a third run of the whole suite: PYTEST_ADDOPTS reaches
      # the pytest that scripts/test_report.py starts. The scope is the one in .coveragerc and the Makefile
      # (tests/unit/test_ci_quality_gate.py fails if they differ). The `coverage` job combines the shards' data files.
      - name: Test shard ${{ matrix.shard }} — final result with skip accounting
        env:
          PGDATABASE: te_mgmt_dev
          PYTEST_ADDOPTS: --cov=api --cov=streamlit_app --cov=build/csv --cov=evals --cov-branch --cov-report=
        run: |
          files="$(python3 scripts/ci_shards.py files --shard ${{ matrix.shard }} --of 3)"
          echo "$files"
          python3 scripts/test_report.py --markers "not accessibility" --strict --paths $files

      - name: Keep this shard's coverage data
        run: mv .coverage coverage-shard-${{ matrix.shard }}.dat

      - name: Upload this shard's coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.dat
          if-no-files-found: error
          retention-days: 7

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports-integration-shard-${{ matrix.shard }}
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 30

  # M7 (#111, BR-37) and #310: the API tests with every connection that isn't to this machine refused and recorded.
  # Its own job, in parallel with the shards and the coverage gate (it used to run after the whole suite).
  integration-egress:
    name: egress-blocked tests ${{ matrix.shard }} (postgres service)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false   # one red shard must not hide what the others found
      matrix:
        shard: [1, 2, 3]   # keep in step with EGRESS_SHARDS in scripts/ci_shards.py (a test checks it)
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies
        # #327: one hashed lock (scripts/lock_requirements.sh): requirements-dev.txt plus api/requirements.txt, which
        # is needed too because tests/test_api.py imports FastAPI at module level.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Write CI database config
        run: |
          cat > build/config.local.env <<'EOF'
          DB_ENGINE="postgresql"
          PG_HOST="localhost"
          PG_PORT="5432"
          PG_SUPERUSER="postgres"
          PG_SUPERUSER_PASSWORD="postgres"
          PG_DB_DEV="te_mgmt_dev"
          PG_SCHEMA_DEV="te_dev"
          PG_DB_TEST="te_mgmt_test"
          PG_SCHEMA_TEST="te_test"
          PG_DB_STAGING="te_mgmt_staging"
          PG_SCHEMA_STAGING="te_staging"
          PG_DB_PROD="te_mgmt_prod"
          PG_SCHEMA_PROD="te_prod"
          EOF

      # env_*.sql scripts do not create their databases — deploy_all.sh does that
      # before invoking them (see build/te_core_schema.sql:41). Mirror it here.
      # Only *.example.sql are committed (concrete env_<env>.sql are gitignored),
      # so materialise them before anything that deploys an environment.
      - name: Materialise environment launchers from templates
        run: |
          for env in dev test staging prod; do
            cp "build/environments/env_${env}.example.sql" \
               "build/environments/env_${env}.sql"
          done
          ls -1 build/environments/

      - name: Create environment databases
        run: |
          for db in te_mgmt_dev te_mgmt_test te_mgmt_staging te_mgmt_prod; do
            if [ -z "$(psql -d postgres -tA -c "SELECT 1 FROM pg_database WHERE datname = '$db'")" ]; then
              psql -v ON_ERROR_STOP=1 -d postgres -c \
                "CREATE DATABASE \"$db\" WITH OWNER = postgres ENCODING = 'UTF8' TEMPLATE = template0 CONNECTION LIMIT = -1"
            fi
          done

      # Tier E deploys all four environments and compares their schemas, so it
      # runs here where the postgres service exists. Order matters: E deploys
      # every environment, which the cross-env parity pytest markers then rely on.
      # Tier X is excluded per ADR-0001 — see the free-tier job's note.
      - name: Evals — Tiers P, I, S, E
        run: python3 evals/runner.py --tiers p,i,s,e --verbose

      - name: Deploy all environments (for cross-env parity)
        run: |
          for env in dev test staging prod; do
            bash build/deploy_all.sh "$env"
          done

      # M7 (#111, BR-37) and #310: the API tests again, with every connection that isn't to this machine refused and
      # recorded. Two layers. Inside Python, tests/egress_guard.py refuses and records the attempt, even when the code
      # swallows the error. Below Python (child processes, libpq), scripts/egress_firewall.sh blocks the network of a
      # throwaway user at the firewall and counts every refused packet; the job fails if the count is not zero.
      # A dedicated user, because the runner agent that streams this job's log shares the runner's user and must keep
      # its network (docs/SOVEREIGNTY.md). That user must be able to read the checkout, hence the chmod.
      - name: Create the user whose network is blocked (#310)
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin egresstest
          sudo chmod o+x "$HOME"

      - name: Block that user's outbound network (#310)
        run: sudo bash scripts/egress_firewall.sh install egresstest

      # The negative control: deliberate attempts from a child process and from libpq must be refused, and the firewall
      # must have counted them. Without that, a zero count below could just mean the counter does not work.
      - name: Prove the block holds for child processes and libpq (#310)
        env:
          PGDATABASE: te_mgmt_dev
          EGRESS_NETWORK_BLOCKED: "1"
        run: |
          # Name every variable to pass on: sudo-rs, the default sudo on newer Ubuntu runners, ignores the option that
          # preserves the whole environment (the first run of this step lost EGRESS_NETWORK_BLOCKED that way).
          as_blocked() {
            sudo env "PATH=$PATH" "PGHOST=$PGHOST" "PGPORT=$PGPORT" "PGUSER=$PGUSER" "PGPASSWORD=$PGPASSWORD" \
              "PGDATABASE=$PGDATABASE" "EGRESS_NETWORK_BLOCKED=$EGRESS_NETWORK_BLOCKED" \
              bash scripts/egress_firewall.sh run egresstest -- "$@"
          }
          as_blocked python3 -m pytest tests/system/test_egress_network_blocked.py -q -p no:cacheprovider
          refused="$(sudo bash scripts/egress_firewall.sh count)"
          echo "the control's deliberate attempts refused by the firewall: $refused packet(s)"
          test "$refused" -ge 1 || { echo "the firewall counted none of the control's attempts, so a zero count below would prove nothing"; exit 1; }
          sudo bash scripts/egress_firewall.sh reset

      - name: API tests with network egress blocked
        env:
          PGDATABASE: te_mgmt_dev
        run: |
          # The control's EGRESS_NETWORK_BLOCKED is deliberately not passed on: its attempts must not run here.
          # This shard's part of tests/system, split by recorded duration (scripts/ci_shards.py).
          files="$(python3 scripts/ci_shards.py files --shard ${{ matrix.shard }} --of 3 --only tests/system/)"
          echo "$files"
          sudo env "PATH=$PATH" "PGHOST=$PGHOST" "PGPORT=$PGPORT" "PGUSER=$PGUSER" "PGPASSWORD=$PGPASSWORD" \
            "PGDATABASE=$PGDATABASE" \
            bash scripts/egress_firewall.sh run egresstest -- \
            python3 -m pytest $files --block-egress -q -p no:cacheprovider

      - name: Fail if anything tried to leave the machine (#310)
        run: sudo bash scripts/egress_firewall.sh check

      - name: Remove the network block (#310)
        if: always()
        run: sudo bash scripts/egress_firewall.sh remove

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports-integration-egress-shard-${{ matrix.shard }}
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 30

  # The coverage gate. Each shard records its own coverage while it runs its tests; this job combines their data files and
  # applies the same floors as before (scripts/check_coverage_floors.py: #194, #274, #278). It runs no tests and needs no
  # database, so it takes seconds once the shards are done. It is skipped when a shard failed (no verdict from a partial
  # run); the gate job then fails on the shard anyway.
  coverage:
    name: coverage gate (api, streamlit_app, build/csv, evals)
    runs-on: ubuntu-latest
    needs: [changes, integration-shards]
    if: needs.changes.outputs.code == 'true' && needs.integration-shards.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Download every shard's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      # #275: a failing step fails the job (bash -e, pipefail). One scope, the same in .coveragerc and the Makefile; see
      # tests/README.md.
      - name: coverage gate (api, streamlit_app, build/csv, evals)
        run: |
          set -eo pipefail
          ls -1 coverage-shard-*.dat
          python -m coverage combine coverage-shard-*.dat
          python -m coverage json -o coverage.json
          python -m coverage report --show-missing | tail -40
          python3 scripts/check_coverage_floors.py coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 30

  # The check that has always been called "integration (postgres service)": it passes only if the shards, the egress job
  # and the coverage gate all succeeded, or were all skipped for a documentation-only change (scripts/ci_gate.py).
  # `always()` so that a failed or skipped job still produces a verdict instead of leaving this check pending.
  integration-postgres:
    name: integration (postgres service)
    needs: [changes, integration-shards, integration-egress, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verdict
        run: |
          python3 scripts/ci_gate.py "${{ needs.changes.outputs.code }}" \
            "shards=${{ needs.integration-shards.result }}" \
            "egress=${{ needs.integration-egress.result }}" \
            "coverage=${{ needs.coverage.result }}"

  # #168: WCAG 2.1 A and AA scans of the frontend (csv-table-hub-main) with
  # Playwright + axe-core in Chromium, against the Vite dev server. The API is
  # stubbed, so this job needs no database and a backend-only change cannot
  # alter what it scans. Known violations are recorded in
  # tests/accessibility/known_violations.json: the job fails on a NEW violation
  # and when a recorded one is fixed (so the list only shrinks). Not yet a
  # required check; make it one after a few green runs (see the issue).
  accessibility:
    name: accessibility (Playwright + axe-core, WCAG 2.1 AA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-a11y.lock

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: csv-table-hub-main/package-lock.json

      - name: Install dev dependencies
        # #327: one hashed lock (scripts/lock_requirements.sh) of requirements-dev.txt, api/requirements.txt (tests/
        # conftest.py imports the API app), requirements-a11y.txt and streamlit_app/requirements.txt.
        run: pip install --require-hashes -r requirements-a11y.lock

      - name: Install frontend dependencies
        working-directory: csv-table-hub-main
        run: npm ci

      # #112: the frontend's own unit tests (vitest). No job ran them before, so a change to the one place the app
      # builds HTML by hand (the print window in src/lib/export.ts) could lose its escaping without anything failing.
      - name: Frontend unit tests (vitest)
        working-directory: csv-table-hub-main
        run: npm test

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # Prints the same final block as the other jobs. --strict fails on any skip.
      # The scans start `npm run dev` themselves (tests/accessibility/conftest.py).
      - name: Accessibility scans — final result with skip accounting
        env:
          A11Y_REPORT_DIR: accessibility-report
        run: python3 scripts/test_report.py --markers accessibility --strict

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-report
          path: accessibility-report/
          if-no-files-found: ignore
          retention-days: 30

  # #273: the browser tests (e2e/): Playwright in Chromium against the real API, the React app and the Streamlit
  # app. The tests start the three servers themselves; they need PostgreSQL with the dev environment deployed, a
  # browser and the frontend's dependencies, so they have a job of their own. test_report.py --paths e2e --strict
  # prints the same final block as the other jobs and fails on any skip. Not yet a required check: make it one
  # after a few green runs (still open under "Owner decisions" in DECISIONS/2026-11-16-streamlit-migration-plan.md).
  browser:
    name: browser (Playwright, e2e/)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: te_mgmt_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 3.12, the one supported version (DECISIONS/2026-11-24-one-python-version.md)
          cache: 'pip'
          cache-dependency-path: requirements-a11y.lock

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: csv-table-hub-main/package-lock.json

      # Playwright comes from requirements-a11y.txt (one place pins it); streamlit is in requirements-dev.txt. Both are
      # in the hashed requirements-a11y.lock (#327).
      - name: Install dev dependencies
        run: pip install --require-hashes -r requirements-a11y.lock

      - name: Install frontend dependencies
        working-directory: csv-table-hub-main
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Write CI database config
        run: |
          cat > build/config.local.env <<'EOF'
          DB_ENGINE="postgresql"
          PG_HOST="localhost"
          PG_PORT="5432"
          PG_SUPERUSER="postgres"
          PG_SUPERUSER_PASSWORD="postgres"
          PG_DB_DEV="te_mgmt_dev"
          PG_SCHEMA_DEV="te_dev"
          EOF

      # Only *.example.sql are committed; deploy_all.sh reads the concrete env_dev.sql.
      - name: Materialise the dev environment launcher
        run: cp build/environments/env_dev.example.sql build/environments/env_dev.sql

      - name: Create the dev database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c \
            "CREATE DATABASE te_mgmt_dev WITH OWNER = postgres ENCODING = 'UTF8' TEMPLATE = template0 CONNECTION LIMIT = -1"

      - name: Deploy the dev environment
        run: bash build/deploy_all.sh dev

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # --strict fails on any skip: a missing prerequisite must fail the job, not skip the tests.
      - name: Browser tests — final result with skip accounting
        run: python3 scripts/test_report.py --paths e2e --strict

      # A screenshot of the page for each failed test (e2e/conftest.py), since a red run cannot be looked at.
      - name: Upload browser-test screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # #329: the React frontend's lint, TypeScript type-check and production build. Before this, only its unit tests ran
  # (in the accessibility job), so a lint error, a type error or a broken build could merge. Needed while React is the
  # default frontend; it goes when the frontend is retired (#257). It needs no database and no Python.
  frontend:
    name: frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csv-table-hub-main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: csv-table-hub-main/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # #327: package-lock.json is the one lock file (bun.lock was removed). npm ci must install exactly it and change
      # nothing that is tracked; a dirty tree means the lock and package.json have drifted apart.
      - name: The install leaves the tree clean
        run: |
          dirty="$(git status --porcelain --untracked-files=no -- .)"
          if [ -n "$dirty" ]; then echo "::error::npm ci changed tracked files:"; echo "$dirty"; exit 1; fi

      - name: Lint (eslint, with prettier)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx --no-install tsc --noEmit

      - name: Production build (vite build)
        run: npm run build
